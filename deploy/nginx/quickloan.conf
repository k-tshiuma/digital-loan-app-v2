# nginx site for QuickLoan: two sites, each serving its built frontend and forwarding /api to its own API.
# Install: copy to /etc/nginx/sites-available/quickloan.conf (symlink into sites-enabled), and
# quickloan-locations.conf and quickloan-admin-access.conf to /etc/nginx/snippets/.
# Replace app.example.com / admin.example.com.
# Certificates: certbot, one per name (docs/deployment-runbook.md).

# Access log without query strings: document and live-status URLs carry the login token in ?token=.
log_format quickloan '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time "$http_user_agent"';

upstream quickloan_borrower_api {
    server 127.0.0.1:5000;
    keepalive 16;
}

upstream quickloan_admin_api {
    server 127.0.0.1:5100;
    keepalive 8;
}

# HTTP: everything to HTTPS. (certbot runs in standalone mode and stops nginx briefly to renew.)
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com admin.example.com;

    return 301 https://$host$request_uri;
}

# Borrower app (public).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;

    root /var/www/quickloan/borrower;
    access_log /var/log/nginx/quickloan-borrower.access.log quickloan;
    error_log  /var/log/nginx/quickloan-borrower.error.log;

    set $quickloan_api quickloan_borrower_api;
    include /etc/nginx/snippets/quickloan-locations.conf;
}

# Admin dashboard (staff).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    root /var/www/quickloan/admin;
    access_log /var/log/nginx/quickloan-admin.access.log quickloan;
    error_log  /var/log/nginx/quickloan-admin.error.log;

    # Which addresses may open the staff site (office/VPN limit). Open to all until that file is edited.
    include /etc/nginx/snippets/quickloan-admin-access.conf;

    set $quickloan_api quickloan_admin_api;
    include /etc/nginx/snippets/quickloan-locations.conf;
}
