# Who may open the admin site (staff dashboard and admin API). Included from quickloan.conf.
# Install as /etc/nginx/snippets/quickloan-admin-access.conf. deploy.sh never overwrites it.
#
# As shipped, everyone may open it (the staff login and the API's own checks still apply).
# To limit it to the office or VPN, replace `allow all;` with the networks, then `deny all;`:
#
#   allow 203.0.113.0/24;      # office
#   allow 198.51.100.7;        # VPN exit address
#   allow 2001:db8:1234::/48;  # office IPv6, if it has one
#   allow 192.0.2.10;          # this server's own public address, for deploy/smoke.js
#   deny all;
#
# Put the same networks in ADMIN_ALLOWED_IPS in /etc/quickloan/admin.env, so the admin API refuses other
# addresses too if this file is ever missing. Others get 403 from nginx.
# Then: sudo nginx -t && sudo systemctl reload nginx
allow all;
