# Shared by both QuickLoan sites (included from quickloan.conf after `set $quickloan_api ...`).
# Install as /etc/nginx/snippets/quickloan-locations.conf.
# Cache headers use `expires`, not add_header, so the security headers below apply in every location.

# Uploads are limited to MAX_UPLOAD_BYTES (10 MB) by the API; allow for the form overhead.
client_max_body_size 12m;

add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Document and live-status URLs carry the login token; never send them to other sites.
add_header Referrer-Policy "no-referrer" always;

# Live status stream (server-sent events): no buffering, kept open (the API pings every 25 s).
location ~ ^/api/applications/[^/]+/events$ {
    proxy_pass http://$quickloan_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

location /api/ {
    proxy_pass http://$quickloan_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The visitor's address only (not a client-supplied X-Forwarded-For); the API trusts it via TRUST_PROXY.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Built files have a content hash in their names: cache them for a year.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# Everything else is the single-page app; index.html is always revalidated so a deploy shows at once.
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
